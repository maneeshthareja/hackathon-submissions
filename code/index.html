<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Submission</title>
</head>
<body>
    <h2>Submit Your Hackathon Artifact</h2>

    <!-- GitHub Login Button -->
    <button onclick="githubLogin()">Login with GitHub</button>
    <p id="user-info"></p>

    <!-- File Upload Section (Hidden Until Login) -->
    <input type="file" id="fileInput" style="display: none;">
    <button id="uploadBtn" onclick="uploadFile()" style="display: none;">Upload</button>
    <p id="status"></p>

    <script>
        const CLIENT_ID = "Ov23liQ4R4WxwBD8Btwv";  // Replace with your GitHub OAuth Client ID
        let accessToken = null;

        function githubLogin() {
            const redirectUri = window.location.origin + "/hackathon-submissions/code/callback.html";
            const authUrl = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&scope=repo&redirect_uri=${redirectUri}`;
            window.location.href = authUrl;
        }

        function checkLogin() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has("access_token")) {
                accessToken = urlParams.get("access_token");
                fetchGitHubUser();
            }
        }

        async function fetchGitHubUser() {
            const response = await fetch("https://api.github.com/user", {
                headers: { Authorization: `token ${accessToken}` }
            });
            const userData = await response.json();
            document.getElementById("user-info").innerText = `Logged in as: ${userData.login}`;
            document.getElementById("fileInput").style.display = "block";
            document.getElementById("uploadBtn").style.display = "block";
        }

        async function uploadFile() {
            const fileInput = document.getElementById("fileInput");
            if (fileInput.files.length === 0) {
                alert("Please select a file.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async function(event) {
                const fileContent = event.target.result.split(",")[1];

                const repoOwner = "maneeshthareja";
                const repoName = "hackathon-submissions";
                const filePath = `submissions/${file.name}`;

                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${accessToken}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `New submission: ${file.name}`,
                        content: fileContent
                    })
                });

                if (response.ok) {
                    document.getElementById("status").innerText = "File uploaded successfully!";
                } else {
                    document.getElementById("status").innerText = "Upload failed.";
                }
            };

            reader.readAsDataURL(file);
        }

        checkLogin();  // Check if user has logged in
    </script>
</body>
</html>
